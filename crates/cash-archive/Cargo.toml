[package]
name = "cash-archive"
description = "Archives and compressed streams for cash's tar, zip and compressors, in pure Rust (spec D78)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# gzip: deflate on the pure-Rust backend (miniz_oxide), and the trailer's CRC-32.
flate2 = { workspace = true, features = ["rust_backend"] }
crc32fast = { workspace = true }
# bzip2 on libbz2-rs-sys, Trifecta Tech's pure-Rust port of libbzip2 (its default
# backend), under the bzip2-1.0.6 license.
bzip2 = "0.6.1"
# xz, lzma and lzip: a pure-Rust port of XZ for Java.
lzma-rust2 = "0.21.0"
# zstd: pure Rust; writes at its fast level only, until libzstd-rs-sys has a Rust API.
ruzstd = "0.9.0"
# zip: Deflate64, which Windows' Explorer writes for large files; pure Rust.
deflate64 = "0.1.12"
# zip: WinZip's AES encryption, as 7-Zip and WinZip write it (PBKDF2 with HMAC-SHA1 for
# the keys, AES in counter mode, an HMAC-SHA1 check); RustCrypto's pure-Rust crates.
aes = "0.9"
hmac = "0.13"
pbkdf2 = "0.13"
sha1 = "0.11"
# zip: PPMd members (variant I, revision 1, as WinZip and 7-Zip write them).
ppmd-rust = "1.4"
# zip: shrunk, reduced and imploded members, PKZIP 1's methods, through the zip crate's
# decoders; nothing else of the crate is used.
zip = { version = "8.6", default-features = false, features = ["legacy-zip"] }
# 7z (`sevenz`, taken from sevenz-rust2): 7-Zip's AES-256, CBC with a key from SHA-256
# rounds, and random salts and IVs for writing; RustCrypto's pure-Rust crates.
cbc = "0.2"
getrandom = "0.4"
sha2 = { workspace = true }
# RAR (`rar`, taken from rars): finding archives inside other files, and compressing on
# a pool of threads; aes, hmac, sha1, sha2 and getrandom as above.
aho-corasick = "1.1"
rayon = "1.12"

[features]
# rars' parts, kept as it gates them; cash builds them all.
default = ["write", "parallel", "recovery", "encryption"]
write = []
parallel = []
recovery = []
encryption = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
