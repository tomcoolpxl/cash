[package]
name = "cash"
description = "Cool Again Shell — a bash-language shell whose execution model is Win32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cash"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The language layer (D1/D9): parser, expansion, control flow, traps, builtins.
cash-shell = { path = "../cash-shell" }

[target.'cfg(windows)'.dependencies]
cash-win32 = { path = "../cash-win32" }
