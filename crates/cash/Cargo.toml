[package]
name = "cash"
description = "Cool Again Shell — a bash-language shell whose execution model is Win32"
version = "0.1.0"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cash"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The language layer (D1/D9): parser, expansion, control flow, traps, builtins.
cash-shell = { path = "../cash-shell" }
# D35: `cash doctor` reports what cash would run, so it needs the builtin set.
cash-builtins = { version = "^0.2.0", path = "../cash-builtins" }
cash-core = { version = "^0.5.0", path = "../cash-core" }

[features]
# D48: uutils coreutils as in-process builtins. On by default — measured at
# +4 MB and 2.2x faster than spawning, and it makes cash self-contained for the
# commands it carries. `--no-default-features` builds without them.
default = ["bundled-coreutils"]
bundled-coreutils = ["cash-shell/experimental-bundled-coreutils"]

[target.'cfg(windows)'.dependencies]
cash-win32 = { path = "../cash-win32" }

# Tests that drive the shell binary live with the binary: CARGO_BIN_EXE_cash is
# only defined for the crate that declares it.

# cash's own acceptance corpus — §4's divergences and every decision wired into
# the shell, asserted against the real cash.exe.
[[test]]
name = "acceptance"
path = "tests/acceptance.rs"

# The awkward corners: spaces in paths, empty files, nesting, and the boundaries
# where two decisions meet.
[[test]]
name = "acceptance-edge-cases"
path = "tests/acceptance_edge_cases.rs"

# M2: real scripts, written the way they are written on Linux.
[[test]]
name = "corpus"
path = "tests/corpus.rs"

# The differential suite absorbed from brush: the same script under cash and real
# bash, diffing stdout, stderr, exit status and filesystem effects. D43 runs these
# on Linux, where a reference bash exists.
[[test]]
name = "cash-compat-tests"
path = "tests/compat_tests.rs"
harness = false

[[test]]
name = "cash-integration-tests"
path = "tests/integration_tests.rs"
harness = false

[[test]]
name = "cash-version-tests"
path = "tests/version_tests.rs"

[[test]]
name = "cash-interactive-tests"
path = "tests/interactive_tests.rs"

[[test]]
name = "cash-completion-tests"
path = "tests/completion_tests.rs"

# D40: completion is the one part of the shell with no command-line surface, so
# these drive a `Shell` directly.
[[test]]
name = "completion-windows"
path = "tests/completion_windows.rs"

# D3/D5: what a script sees of its environment, and the here-document deadlock.
[[test]]
name = "environment-contract"
path = "tests/environment_contract.rs"

# D3/D7/D8/D34/D35: what cash says it will run vs what it runs.
[[test]]
name = "resolution-honesty"
path = "tests/resolution_honesty.rs"

# D48: one pager behind `less` and `more`.
[[test]]
name = "pager"
path = "tests/pager.rs"

# D48: `ps`, which uutils does not carry.
[[test]]
name = "ps-builtin"
path = "tests/ps_builtin.rs"

# D11/D22: `$!` and background job identity.
[[test]]
name = "background-pid"
path = "tests/background_pid.rs"

# D21/D22: what a kill target means, including the `kill 0` that used to signal the
# whole console.
[[test]]
name = "kill-targets"
path = "tests/kill_targets.rs"

# D40: `docker completion bash` and friends, which need bash-completion's helpers.
[[test]]
name = "completion-scripts"
path = "tests/completion_scripts.rs"

[dev-dependencies]
anyhow = "1.0.102"
# The absorbed differential suite parses its own CLI options and drives an async
# shell, so it needs these directly rather than through cash-shell.
clap = { version = "4.6.0", features = ["derive", "env"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tempfile = "3.27.0"
cash-parser = { version = "^0.4.0", path = "../cash-parser" }
# The completion tests drive a `Shell` directly rather than through the binary,
# because completion has no command-line surface to assert against.
cash-test-harness = { path = "../cash-test-harness", features = ["insta"] }
assert_cmd = "2.2.0"
assert_fs = "1.1.3"
colored = "3.1.1"
descape = "3.0.0"
diff = "0.1.13"
glob = "0.3.3"
indent = "0.1.1"
indexmap = "2.13.0"
junit-report = "0.9.0"
os-release = "0.1.0"
predicates = "3.1.4"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
strip-ansi-escapes = "0.2.1"
test-with = { version = "0.17.0", default-features = false, features = [
    "executable",
] }
version-compare = "0.2.1"
walkdir = "2.5.0"
which = "8.0.2"
