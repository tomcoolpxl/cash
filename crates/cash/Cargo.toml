[package]
name = "cash"
description = "Cool Again Shell — a bash-language shell whose execution model is Win32"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cash"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The language layer (D1/D9): parser, expansion, control flow, traps, builtins.
cash-shell = { workspace = true }
# D35: `cash doctor` reports what cash would run, so it needs the builtin set.
cash-builtins = { workspace = true }
cash-core = { workspace = true }
cash-win32 = { workspace = true }

[features]
# D48: uutils coreutils as in-process builtins. On by default — measured at
# +4 MB and 2.2x faster than spawning, and it makes cash self-contained for the
# commands it carries. `--no-default-features` builds without them.
default = ["bundled-coreutils"]
bundled-coreutils = ["cash-shell/experimental-bundled-coreutils"]

[build-dependencies]
# The icon and version resource in cash.exe (ROADMAP item 18).
winresource = "0.1.31"

# Tests that drive the shell binary live with the binary: CARGO_BIN_EXE_cash is
# only defined for the crate that declares it.

# cash's own acceptance corpus — §4's divergences and every decision wired into
# the shell, asserted against the real cash.exe.
[[test]]
name = "acceptance"
path = "tests/acceptance.rs"

# The awkward corners: spaces in paths, empty files, nesting, and the boundaries
# where two decisions meet.
[[test]]
name = "acceptance-edge-cases"
path = "tests/acceptance_edge_cases.rs"

# M2: real scripts, written the way they are written on Linux.
[[test]]
name = "corpus"
path = "tests/corpus.rs"

[[test]]
name = "cash-integration-tests"
path = "tests/integration_tests.rs"
harness = false

[[test]]
name = "conpty-interactive-tests"
path = "tests/conpty_interactive_tests.rs"

# D40: completion is the one part of the shell with no command-line surface, so
# these drive a `Shell` directly.
[[test]]
name = "completion-windows"
path = "tests/completion_windows.rs"

# D22/§4 #20: $UID agreeing with `id`, and `jobs -l`.
[[test]]
name = "identity-and-jobs"
path = "tests/identity_and_jobs.rs"

# `select`, a bash construct cash could not parse at all.
[[test]]
name = "select-clause"
path = "tests/select_clause.rs"

# D11/D26: pipelines that actually overlap, and `read -t`.
[[test]]
name = "pipeline-concurrency"
path = "tests/pipeline_concurrency.rs"

# D3/D5: what a script sees of its environment, and the here-document deadlock.
[[test]]
name = "environment-contract"
path = "tests/environment_contract.rs"

# D3/D7/D8/D34/D35: what cash says it will run vs what it runs.
[[test]]
name = "resolution-honesty"
path = "tests/resolution_honesty.rs"

# D48: one pager behind `less` and `more`.
[[test]]
name = "pager"
path = "tests/pager.rs"

# D48: `ps`, which uutils does not carry.
[[test]]
name = "ps-builtin"
path = "tests/ps_builtin.rs"

# ROADMAP item 15: interactive behaviour against Git Bash 5.3 on a ConPTY.
[[test]]
name = "pty-oracle"
path = "tests/pty_oracle.rs"

# open-issues.md item 1: how fast the line editor keeps up on a ConPTY, against PowerShell.
# A measurement, ignored and run by hand; the command is in the file's doc.
[[test]]
name = "pty-latency"
path = "tests/pty_latency.rs"

# D11/D22: `$!` and background job identity.
[[test]]
name = "background-pid"
path = "tests/background_pid.rs"

# D21/D22: what a kill target means, including the `kill 0` that used to signal the
# whole console.
[[test]]
name = "kill-targets"
path = "tests/kill_targets.rs"

# D40: `docker completion bash` and friends, which need bash-completion's helpers.
[[test]]
name = "completion-scripts"
path = "tests/completion_scripts.rs"

# Git for Windows' git-prompt.sh (`__git_ps1`), sourced from the Git install.
[[test]]
name = "git-prompt"
path = "tests/git_prompt.rs"

# Comprehensive parameter matrix across builtins
[[test]]
name = "builtin-parameters"
path = "tests/builtin_parameters.rs"

# find and xargs parity
[[test]]
name = "find-xargs"
path = "tests/find_xargs.rs"

# top builtin batch mode and monitoring
[[test]]
name = "top-builtin"
path = "tests/top_builtin.rs"

# coolfetch system banner
[[test]]
name = "coolfetch"
path = "tests/coolfetch.rs"

[dev-dependencies]
anyhow = "1.0.102"
# The YAML case runner parses its own CLI options and the completion tests drive an
# async shell, so they need these directly rather than through cash-shell.
clap = { version = "4.6.0", features = ["derive", "env"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tempfile = "3.27.0"
cash-parser = { workspace = true }
# The completion tests drive a `Shell` directly rather than through the binary,
# because completion has no command-line surface to assert against.
cash-test-harness = { workspace = true, features = ["insta"] }
assert_cmd = "2.2.0"
assert_fs = "1.1.3"
# Checks the Windows Terminal profile GUID against Terminal's own derivation (UUIDv5).
uuid = { version = "1.26.1", features = ["v5"] }
colored = "3.1.1"
descape = "3.0.0"
diff = "0.1.13"
glob = "0.3.3"
indent = "0.1.1"
indexmap = "2.13.0"
junit-report = "0.9.0"
os-release = "0.1.0"
predicates = "3.1.4"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
strip-ansi-escapes = "0.2.1"
test-with = { version = "0.17.0", default-features = false, features = [
    "executable",
] }
version-compare = "0.2.1"
walkdir = "2.5.0"
which = "8.0.2"
