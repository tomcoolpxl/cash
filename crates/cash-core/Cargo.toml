[package]
name = "cash-core"
description = "Reusable core of a POSIX/bash shell (used by cash-shell)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "cash-parser/serde", "rpds/serde", "chrono/serde"]

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.89"
cash-parser = { workspace = true }
bon = { workspace = true }
cached = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
color-print = { workspace = true }
fancy-regex = { workspace = true }
futures = { workspace = true }
inherent = "1.0.13"
itertools = { workspace = true }
normalize-path = "0.2.1"
rand = "0.10.0"
# The leftmost-longest match of `[[ =~ ]]` (LANG-17); already built for `regex`.
regex-automata = "0.4.18"
rpds = "1.2.0"
serde = { workspace = true, optional = true, features = ["derive"] }
strum = { workspace = true }
strum_macros = "0.28.0"
thiserror = { workspace = true }
tracing = { workspace = true }
hostname = "0.4.2"
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
# cash: the Win32 semantics layer (D3, D20, D28, D41, ...). Lives outside vendor/ so
# the shell semantics and the platform layer stay separable.
cash-win32 = { workspace = true }
# GNU `env -S` splitting for `#!/usr/bin/env -S …` lines (W32-08); the `env` builtin
# already builds it.
uu_env = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true, features = ["unstable"] }
tempfile = { workspace = true }
