[package]
name = "cash-core"
description = "Reusable core of a POSIX/bash shell (used by cash-shell)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "cash-parser/serde", "rpds/serde", "chrono/serde"]
experimental-parser = ["cash-parser/winnow-parser"]

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.89"
cash-parser = { workspace = true }
bon = "3.9.1"
cached = "2.0.2"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
color-print = "0.3.7"
fancy-regex = "0.19.0"
futures = "0.3.32"
inherent = "1.0.13"
itertools = "0.14.0"
normalize-path = "0.2.1"
rand = "0.10.0"
# The leftmost-longest match of `[[ =~ ]]` (LANG-17); already built for `regex`.
regex-automata = "0.4.18"
rpds = "1.2.0"
serde = { version = "1.0.228", optional = true, features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tracing = "0.1.44"
hostname = "0.4.2"
tokio = { version = "1.52.3", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
# cash: the Win32 semantics layer (D3, D20, D28, D41, ...). Lives outside vendor/ so
# the shell semantics and the platform layer stay separable.
cash-win32 = { workspace = true }
check_elevation = "0.2.7"
# GNU `env -S` splitting for `#!/usr/bin/env -S …` lines (W32-08); the `env` builtin
# already builds it.
uu_env = "0.12.0"
whoami = "2.1.1"

[dev-dependencies]
anyhow = "1.0.102"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
tempfile = "3.27.0"
