[package]
# The name and version crossterm had: `uu_more`, which cash bundles unchanged, asks for
# crossterm 0.29, and `[patch.crates-io]` in the workspace hands it this one, which it
# can only do for a crate of that name and version.
name = "crossterm"
version = "0.29.0"
description = "Terminal I/O for cash, taken from crossterm 0.29.0 and made its own"
authors.workspace = true
categories.workspace = true
# Crossterm's edition, kept until the move to the workspace's is a change of its own.
edition = "2021"
keywords.workspace = true
license = "MIT"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[features]
default = ["bracketed-paste", "events", "windows", "derive-more"]
bracketed-paste = []
derive-more = ["dep:derive_more"]
events = []
serde = ["dep:serde", "bitflags/serde"]
windows = ["dep:winapi", "dep:crossterm_winapi"]
# Asked for by `uu_more`'s manifest (on Apple targets) and by `libc`'s feature name: they
# do nothing on Windows.
libc = []
use-dev-tty = []

[lib]
name = "crossterm"
path = "src/lib.rs"
bench = false

[dependencies]
bitflags = "2.9"
derive_more = { version = "2.0.0", features = ["is_variant"], optional = true }
document-features = "0.2.11"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"], optional = true }
crossterm_winapi = { version = "0.9.1", optional = true }
winapi = { version = "0.3.9", optional = true, features = [
    "winuser",
    "winerror",
    # cash: the batched console reads in src/event/source/windows.rs.
    "consoleapi",
    "wincon",
] }

[dev-dependencies]
serde_json = "1.0"
serial_test = "3.0.0"
temp-env = "0.3.6"

[lints]
workspace = true
