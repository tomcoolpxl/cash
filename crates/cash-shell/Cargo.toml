[package]
name = "cash-shell"
description = "Rust-implemented shell focused on POSIX and bash compatibility"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

# Generates man pages, markdown help, completion scripts, and the config
# schema. Lives here so that xtask doesn't have to depend on cash-shell;
# `cargo xtask gen` shells out to it.
[[example]]
name = "gen"
path = "examples/gen.rs"
required-features = ["schema"]

[[bench]]
name = "shell"
path = "benches/shell.rs"
harness = false

[features]
default = ["basic", "reedline", "minimal"]
basic = ["cash-interactive/basic"]
minimal = ["cash-interactive/minimal"]
reedline = ["cash-interactive/reedline"]
experimental = ["experimental-load"]
bundled-coreutils = [
    "dep:cash-coreutils-builtins",
    "cash-coreutils-builtins/coreutils.all",
]
experimental-load = ["dep:serde_json", "cash-core/serde"]
schema = ["dep:schemars"]

[lints]
workspace = true

[dependencies]
cash-awk = { workspace = true }
cash-bc = { workspace = true }
cash-sed = { workspace = true }
cash-core = { workspace = true }
cash-builtins = { workspace = true }
cash-coreutils-builtins = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "env"] }
color-print = { workspace = true }
etcetera = "0.11.0"
schemars = { version = "1.2.1", optional = true }
serde = { workspace = true, features = ["derive"] }
toml = "1.1.0"
const_format = "0.2.36"
git-version = "0.3.9"
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3.23"
# cash: the Win32 semantics layer. The bundled dispatcher (D48) needs D3's path
# rendering, because a few uutils construct absolute paths and spell them natively.
cash-win32 = { workspace = true }
cash-interactive = { workspace = true, features = [
    "basic",
    "reedline",
] }
crossterm = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
anyhow = { workspace = true }
# Used by the `gen` example.
clap-markdown = "0.1.5"
clap_complete = "4.6.4"
clap_mangen = "0.3.0"
# Also a regular optional dependency, enabled by `experimental-load`. The `gen`
# example needs it without that feature, so it's listed here too.
serde_json = { workspace = true }
cash-parser = { workspace = true }
criterion = { workspace = true, features = ["async_tokio", "html_reports"] }
pretty_assertions = { workspace = true, features = ["unstable"] }
serde = { workspace = true, features = ["derive"] }
which = { workspace = true }
