[package]
name = "cash-shell"
description = "Rust-implemented shell focused on POSIX and bash compatibility"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
# Application tier; see docs/reference/msrv-policy.md.
rust-version = "1.95.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/cash-{ target }{ archive-suffix }"

[lib]
bench = false

# Generates man pages, markdown help, completion scripts, and the config
# schema. Lives here so that xtask doesn't have to depend on cash-shell;
# `cargo xtask gen` shells out to it.
[[example]]
name = "gen"
path = "examples/gen.rs"
required-features = ["schema"]

[[bench]]
name = "shell"
path = "benches/shell.rs"
harness = false

[features]
default = ["basic", "reedline", "minimal"]
basic = ["cash-interactive/basic"]
minimal = ["cash-interactive/minimal"]
reedline = ["cash-interactive/reedline"]
experimental = [
    "experimental-bundled-coreutils",
    "experimental-load",
    "experimental-parser",
]
experimental-bundled-coreutils = [
    "dep:cash-coreutils-builtins",
    "cash-coreutils-builtins/coreutils.all",
]
experimental-load = ["dep:serde_json", "cash-core/serde"]
experimental-parser = [
    "cash-core/experimental-parser",
    "cash-parser/winnow-parser",
]
schema = ["dep:schemars"]

[lints]
workspace = true

[dependencies]
cash-awk = { workspace = true }
cash-bc = { workspace = true }
cash-sed = { workspace = true }
cash-core = { workspace = true }
cash-builtins = { workspace = true }
cash-coreutils-builtins = { workspace = true, optional = true }
clap = { version = "4.6.0", features = ["derive", "env"] }
color-print = "0.3.7"
etcetera = "0.11.0"
schemars = { version = "1.2.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.0"
const_format = "0.2.36"
git-version = "0.3.9"
serde_json = { version = "1.0.149", optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
human-panic = "2.0.6"
# cash: the Win32 semantics layer. The bundled dispatcher (D48) needs D3's path
# rendering, because a few uutils construct absolute paths and spell them natively.
cash-win32 = { workspace = true }
cash-interactive = { workspace = true, features = [
    "basic",
    "reedline",
] }
crossterm = "0.29.0"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
anyhow = "1.0.102"
tempfile = "3.27.0"
# Used by the `gen` example.
clap-markdown = "0.1.5"
clap_complete = "4.6.4"
clap_mangen = "0.3.0"
# Also a regular optional dependency, enabled by `experimental-load`. The `gen`
# example needs it without that feature, so it's listed here too.
serde_json = "1.0.149"
cash-parser = { workspace = true }
cash-test-harness = { workspace = true, features = ["insta"] }
assert_cmd = "2.2.0"
assert_fs = "1.1.3"
colored = "3.1.1"
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
descape = "3.0.0"
diff = "0.1.13"
glob = "0.3.3"
indent = "0.1.1"
indexmap = "2.13.0"
junit-report = "0.9.0"
os-release = "0.1.0"
predicates = "3.1.4"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
strip-ansi-escapes = "0.2.1"
test-with = { version = "0.17.0", default-features = false, features = [
    "executable",
] }
version-compare = "0.2.1"
walkdir = "2.5.0"
which = "8.0.2"
