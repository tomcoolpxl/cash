[package]
name = "cash-builtins"
description = "Builtins for a POSIX/bash shell (used by cash-shell)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = [
    'builtin.alias',
    'builtin.bg',
    'builtin.bind',
    'builtin.break',
    'builtin.builtin',
    'builtin.caller',
    'builtin.cd',
    'builtin.colon',
    'builtin.command',
    'builtin.compgen',
    'builtin.compopt',
    'builtin.complete',
    'builtin.continue',
    'builtin.declare',
    'builtin.dirs',
    'builtin.disown',
    'builtin.dot',
    'builtin.echo',
    'builtin.enable',
    'builtin.eval',
    'builtin.exec',
    'builtin.exit',
    'builtin.export',
    'builtin.false',
    'builtin.fc',
    'builtin.fg',
    'builtin.getopts',
    'builtin.hash',
    'builtin.help',
    'builtin.history',
    'builtin.jobs',
    'builtin.kill',
    'builtin.let',
    'builtin.mapfile',
    'builtin.popd',
    'builtin.printf',
    'builtin.pushd',
    'builtin.pwd',
    'builtin.read',
    'builtin.return',
    'builtin.set',
    'builtin.shift',
    'builtin.shopt',
    'builtin.test',
    'builtin.times',
    'builtin.trap',
    'builtin.true',
    'builtin.type',
    'builtin.ulimit',
    'builtin.umask',
    'builtin.unalias',
    'builtin.unset',
    'builtin.wait',
]

'builtin.alias' = []
'builtin.bg' = []
'builtin.bind' = []
'builtin.break' = []
'builtin.builtin' = []
'builtin.caller' = []
'builtin.cd' = []
'builtin.colon' = []
'builtin.command' = []
'builtin.compgen' = []
'builtin.complete' = []
'builtin.compopt' = []
'builtin.continue' = []
'builtin.declare' = []
'builtin.dirs' = []
'builtin.disown' = []
'builtin.dot' = []
'builtin.echo' = []
'builtin.enable' = []
'builtin.eval' = []
'builtin.exec' = []
'builtin.exit' = []
'builtin.export' = []
'builtin.false' = []
'builtin.fc' = []
'builtin.fg' = []
'builtin.getopts' = []
'builtin.hash' = []
'builtin.help' = []
'builtin.history' = []
'builtin.jobs' = []
'builtin.kill' = []
'builtin.let' = []
'builtin.mapfile' = []
'builtin.popd' = []
'builtin.printf' = []
'builtin.pushd' = []
'builtin.pwd' = []
'builtin.read' = []
'builtin.return' = []
'builtin.set' = []
'builtin.shift' = []
'builtin.shopt' = []
'builtin.test' = []
'builtin.times' = []
'builtin.trap' = []
'builtin.true' = []
'builtin.type' = []
'builtin.ulimit' = []
'builtin.umask' = []
'builtin.unalias' = []
'builtin.unset' = []
'builtin.wait' = []

[lints]
workspace = true

[dependencies]
futures = { workspace = true }
cash-core = { workspace = true }
cash-parser = { workspace = true }
cash-picker = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
fancy-regex = { workspace = true }
# `grep`: ripgrep's library crates for the matcher and the line-oriented searcher; the
# printing is GNU grep's, done here. A pattern the regex crate cannot take (a
# backreference) runs through fancy-regex behind the same matcher trait.
grep-matcher = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
# `grep`'s patterns are sed's: the bundled sed's reading of GNU's basic and extended
# syntaxes, its error wording and its longest-alternative ordering.
cash-sed = { workspace = true }
# `grep -o` and `--color`: where an alternative can match nothing (`x*\|b`), the regex
# crate takes the empty match and GNU grep the longest; a second regex with "all" match
# semantics, anchored at the match's start, gives the end GNU would. Already in the tree
# through `regex`.
regex-automata = { workspace = true }
# `grep --include`, `--exclude`, `--exclude-dir`: GNU's file name globs.
glob = { workspace = true }
itertools = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utf8-chars = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
uucore = { workspace = true, features = [
    "colors",
    "format",
    "signals",
] }
cash-win32 = { workspace = true }
# D48: the `less`/`more` pager needs the terminal size and raw-mode keys. Same
# version cash-interactive already pulls in, so this adds no new tree.
crossterm = { workspace = true }
# `ls`: LS_COLORS and colour per file type, and the width of names with icons. All three are
# already in the tree, through reedline.
lscolors = "0.21.0"
nu-ansi-term = { workspace = true }
unicode-width = { workspace = true }
# `uuidgen`: every version util-linux's makes (v1, v3, v4, v5, v6, v7).
uuid = { workspace = true, features = ["v1", "v3", "v4", "v5", "v6", "v7"] }
# `gzip`, `gunzip`, `zcat`: deflate from miniz_oxide (pure Rust, no C), the header,
# the trailer and GNU gzip's interface done here; crc32fast for the trailer's CRC-32.
flate2 = { workspace = true, features = ["rust_backend"] }
crc32fast = { workspace = true }
# Every GNU-style command line, read once (D78).
cash-getopt = { workspace = true }
# Archives and compressed streams, the codecs gzip and the other compressors share (D78).
cash-archive = { workspace = true }
# `7z h` and `-scrc`: 7-Zip's hashes. All but blake2s_simd (BLAKE2sp, by the authors of
# the blake2b_simd already in the tree) were already in the tree.
sha1 = "0.11.0"
sha2 = { workspace = true }
sha3 = "0.12.0"
md-5 = "0.11.0"
crc = "3.3.0"
twox-hash = "2.1.5"
blake2s_simd = "1.0"

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true, features = ["unstable"] }
