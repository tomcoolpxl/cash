[package]
name = "cash-parser"
description = "POSIX/bash shell tokenizer and parsers (used by cash-shell)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
bench = false

[features]
arbitrary = ["dep:arbitrary"]
debug-tracing = ["peg/trace"]
diagnostics = ["dep:miette"]
serde = ["dep:serde"]
winnow-parser = ["dep:winnow"]

[dependencies]
itertools = { workspace = true }
arbitrary = { version = "1.4.2", optional = true, features = ["derive"] }
bon = { workspace = true }
cached = { workspace = true }
miette = { version = "7.6.0", optional = true, default-features = false, features = [
    "derive",
] }
peg = "0.8.6"
serde = { workspace = true, optional = true, features = ["derive", "rc"] }
thiserror = { workspace = true }
tracing = { workspace = true }
utf8-chars = { workspace = true }
winnow = { version = "1.0.0", optional = true }

[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
insta = { workspace = true, features = ["glob", "ron", "yaml", "redactions"] }
miette = { version = "7.6.0", features = ["fancy"] }
pretty_assertions = { workspace = true, features = ["unstable"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[[bench]]
name = "parser"
harness = false

[[example]]
name = "miette"
required-features = ["diagnostics"]

[[example]]
name = "serde"
required-features = ["serde"]
