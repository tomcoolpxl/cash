[package]
name = "cash-reedline"
description = "The line editor of cash's prompt, taken from reedline 0.51.0 and made its own"
version.workspace = true
authors.workspace = true
categories.workspace = true
# Reedline's edition, kept until the move to the workspace's is a change of its own.
edition = "2021"
keywords.workspace = true
license = "MIT"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[features]
default = ["helix"]
helix = []

[lib]
# The code, its tests and its examples say `reedline::`.
name = "reedline"
path = "src/lib.rs"
bench = false

[dependencies]
chrono = { version = "0.4.19", default-features = false, features = ["clock", "serde"] }
crossterm = { workspace = true, features = ["serde"] }
fd-lock = "4.0.2"
itertools = { workspace = true }
nu-ansi-term = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
strip-ansi-escapes = "0.2.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = { workspace = true }
unicase = "2.8.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"

[dev-dependencies]
gethostname = "1.1.0"
pretty_assertions = "1.4.0"
rstest = { version = "0.27.0", default-features = false }
serde_json = "1.0"
tempfile = { workspace = true }

[lints]
workspace = true
