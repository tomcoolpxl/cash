[package]
name = "cash-awk"
description = "Native AWK implementation for cash-shell (absorbed from posixutils-rs)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license = "MIT"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
pest = "2.9.2"
pest_derive = "2.9.2"
lexical = { version = "7", features = ["format"] }
rand = { version = "0.10.0", default-features = false }
regex = { workspace = true }
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "meta"] }
regex-syntax = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
