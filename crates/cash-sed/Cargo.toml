[package]
name = "cash-sed"
description = "Native sed implementation for cash-shell (absorbed and hardened from uutils/sed)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license = "MIT"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[features]
default = ["sed"]
sed = []

[[bin]]
name = "sed"
path = "src/bin/sed.rs"

[dependencies]
clap = { version = "4.6.0", features = ["wrap_help", "cargo"] }
fancy-regex = "0.19.2"
memchr = "2.7.4"
phf = "0.14.0"
predicates = "3.1.3"
regex = "1.13.1"
regex-syntax = "0.8.5"
tempfile = "3.27.0"
textwrap = { version = "0.16.1", features = ["terminal_size"] }
uucore = "0.12.0"

[dev-dependencies]
assert_fs = "1.1.3"
chrono = { version = "0.4.37", default-features = false, features = ["clock"] }
ctor = "1.0.0"
hex = "0.4"
pretty_assertions = "1"
rand = "0.8.5"
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
uucore = { version = "0.12.0", features = ["entries", "process", "signals", "benchmark"] }
uutests = "0.12.0"

[lints.rust]
warnings = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
