[package]
name = "cash-sed"
description = "Native sed implementation for cash-shell (absorbed and hardened from uutils/sed)"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license = "MIT"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[features]
default = ["sed"]
sed = []

[[bin]]
name = "sed"
path = "src/bin/sed.rs"

[dependencies]
clap = { workspace = true, features = ["wrap_help", "cargo"] }
fancy-regex = { workspace = true }
memchr = "2.7.4"
regex = { workspace = true }
regex-syntax = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = ["signals"] }

[dev-dependencies]
assert_fs = { workspace = true }
ctor = "1.0.0"
hex = "0.4"
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
uucore = { workspace = true, features = ["entries", "process", "signals", "benchmark"] }
uutests = "0.12.0"

[lints]
workspace = true
