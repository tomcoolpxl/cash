[package]
name = "cash-interactive"
description = "Interactive layer of cash-shell"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
basic = ["dep:crossterm", "completion"]
completion = []
minimal = []
reedline = [
    "dep:reedline",
    "dep:nu-ansi-term",
    "dep:crossterm",
    "dep:unicode-segmentation",
    "dep:unicode-width",
    "dep:serde_json",
    "dep:cash-picker",
    "completion",
    "highlighting",
]
highlighting = []

[lints]
workspace = true

[dependencies]
bon = { workspace = true }
cash-parser = { workspace = true }
cash-core = { workspace = true }
crossterm = { workspace = true, features = ["serde"], optional = true }
indexmap = "2.13.0"
nu-ansi-term = { workspace = true, optional = true }
radix_trie = "0.3.0"
reedline = { version = "0.51.0", optional = true }
cash-picker = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
futures-util = "0.3.34"
unicode-segmentation = { version = "1.13.3", optional = true }
unicode-width = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# cash: reads a Scoop shim's target, to start carapace itself (D63).
cash-win32 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["unstable"] }
tempfile = { workspace = true }
