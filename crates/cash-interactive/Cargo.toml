[package]
name = "cash-interactive"
description = "Interactive layer of cash-shell"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
# Application tier; see docs/reference/msrv-policy.md.
rust-version = "1.95.0"

[lib]
bench = false

[features]
default = []
basic = ["dep:crossterm", "completion"]
completion = []
minimal = []
reedline = [
    "dep:reedline",
    "dep:nu-ansi-term",
    "dep:crossterm",
    "dep:unicode-segmentation",
    "dep:serde_json",
    "completion",
    "highlighting",
]
highlighting = []

[lints]
workspace = true

[dependencies]
bon = "3.9.1"
cash-parser = { workspace = true }
cash-core = { workspace = true }
crossterm = { version = "0.29.0", features = ["serde"], optional = true }
indexmap = "2.13.0"
nu-ansi-term = { version = "0.50.3", optional = true }
radix_trie = "0.3.0"
reedline = { version = "0.51.0", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync"] }
tracing = "0.1.44"
futures-util = "0.3.34"
unicode-segmentation = { version = "1.13.3", optional = true }
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
tempfile = "3.27.0"
