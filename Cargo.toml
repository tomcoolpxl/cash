[workspace]
resolver = "3"
members = ["crates/cash-win32"]

# vendor/brush is its own workspace (the D9 soft fork). Keeping it excluded
# means cash's crates build independently and the vendor diff stays minimal.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/thraa/cash"
rust-version = "1.88.0"

[workspace.lints.rust]
warnings = { level = "deny" }
missing_docs = { level = "warn" }
