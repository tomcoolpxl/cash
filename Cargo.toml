[workspace]
resolver = "3"
members = [
    "crates/cash",
    "crates/cash-win32",
    "crates/cash-core",
    "crates/cash-parser",
    "crates/cash-builtins",
    "crates/cash-coreutils-builtins",
    "crates/cash-interactive",
    "crates/cash-shell",
    "crates/cash-test-harness",
    "crates/cash-awk",
    "crates/cash-bc",
    "crates/cash-sed",
    "crates/cash-picker",
    "xtask",
]
default-members = ["crates/cash"]
# Upstream code carried with a patch (see its CASH-PATCHES.md), not linted as cash's own.
exclude = ["vendor/crossterm", "vendor/reedline", "vendor/uutils"]

[workspace.package]
version = "1.4.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/tomcoolpxl/cash"
# The MSRV is the toolchain rust-toolchain.toml pins, the only one CI builds with.
rust-version = "1.99"
authors = ["thraa"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "shell", "sh", "bash", "windows"]
readme = "README.md"

[workspace.dependencies]
cash-awk = { version = "1.3.13", path = "crates/cash-awk" }
cash-bc = { version = "1.3.13", path = "crates/cash-bc" }
cash-builtins = { version = "1.3.13", path = "crates/cash-builtins" }
cash-core = { version = "1.3.13", path = "crates/cash-core" }
cash-coreutils-builtins = { version = "1.3.13", path = "crates/cash-coreutils-builtins" }
cash-interactive = { version = "1.3.13", path = "crates/cash-interactive" }
cash-parser = { version = "1.3.13", path = "crates/cash-parser" }
cash-picker = { version = "1.3.13", path = "crates/cash-picker" }
cash-sed = { version = "1.3.13", path = "crates/cash-sed" }
cash-shell = { version = "1.3.13", path = "crates/cash-shell" }
cash-test-harness = { version = "1.3.13", path = "crates/cash-test-harness" }
cash-win32 = { version = "1.3.13", path = "crates/cash-win32" }

# External crates two or more members use, at one version (ARCH-17). A member
# names its own features, and whether the dependency is optional.
anyhow = "1.0.102"
assert_cmd = "2.2.0"
assert_fs = "1.1.3"
bon = "3.9.1"
cached = "4.0.0"
chrono = "0.4.44"
chrono-tz = "0.10.4"
clap = "4.6.0"
color-print = "0.3.7"
criterion = "0.8.2"
crossterm = "0.29.0"
diff = "0.1.13"
fancy-regex = "0.19.2"
futures = "0.3.32"
glob = "0.3.3"
indent = "0.1.1"
insta = "1.47.1"
itertools = "0.15.0"
nu-ansi-term = "0.50.3"
pretty_assertions = "1.4.1"
proptest = "1"
regex = "1.13.1"
regex-syntax = "0.8.5"
serde = "1.0.228"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
strum = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
unicode-width = "0.2.2"
utf8-chars = "3.0.6"
uu_env = "0.12.0"
uucore = { version = "0.12.0", default-features = false }
which = "8.0.2"

# Lint configuration inherited from brush (MIT, (c) 2024 reuben olinsky). Kept as-is:
# it is strict, the absorbed code already satisfies it, and loosening it would let the
# absorbed crates rot.
[workspace.lints.rust]
warnings = { level = "deny" }
future_incompatible = { level = "deny" }
missing_docs = { level = "deny" }
nonstandard_style = { level = "deny" }
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_attributes = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unknown_lints = { level = "allow", priority = -100 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

expect_used = "deny"
format_push_string = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
todo = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

bool_to_int_with_if = "allow"
cognitive_complexity = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
if_same_then_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

# Debug and test builds keep line numbers, which is all a panic backtrace needs, and no
# debug info for dependencies. Full debug info made every test executable carry a
# PDB of a quarter of a gigabyte; `--profile debugging` puts it back for a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

# The everyday optimized build for local use: thin LTO over parallel codegen units builds
# in a fraction of the time `dist` takes.
[profile.release]
strip = true
lto = "thin"
# Interactive cash catches an unexpected panic at the command boundary and returns to
# the prompt. `abort` bypasses that recovery path and terminates the entire shell.
panic = "unwind"

# What is shipped: the release workflow builds `--profile dist`, into target/dist.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
strip = "debuginfo"

# Reedline 0.51.0 with the patches listed in vendor/reedline/CASH-PATCHES.md: a `bind -x`
# command's output was painted over by the next prompt (ROADMAP item 15); each keystroke
# redrew the whole prompt; each paste waited 100 ms before it was drawn.
#
# Crossterm 0.29.0 with the patch in vendor/crossterm/CASH-PATCHES.md: console input is
# read in batches rather than one record per round trip to the console host.
#
# The uutils `tee`, `sort`, `uniq` and `shuf` 0.12.0 with the patch in
# vendor/uutils/CASH-PATCHES.md: a `>(...)` they are to write is opened as the named pipe
# it is, which cannot be created or truncated (D17).
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
reedline = { path = "vendor/reedline" }
uu_shuf = { path = "vendor/uutils/uu_shuf" }
uu_sort = { path = "vendor/uutils/uu_sort" }
uu_tee = { path = "vendor/uutils/uu_tee" }
uu_uniq = { path = "vendor/uutils/uu_uniq" }
