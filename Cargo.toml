[workspace]
resolver = "3"
members = [
    "crates/cash",
    "crates/cash-win32",
    "crates/cash-core",
    "crates/cash-parser",
    "crates/cash-builtins",
    "crates/cash-coreutils-builtins",
    "crates/cash-interactive",
    "crates/cash-shell",
    "crates/cash-test-harness",
    "crates/cash-awk",
    "crates/cash-bc",
    "crates/cash-sed",
    "xtask",
]
default-members = ["crates/cash"]
# Upstream code carried with a patch (see its CASH-PATCHES.md), not linted as cash's own.
exclude = ["vendor/crossterm", "vendor/reedline"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/thraa/cash"
rust-version = "1.88.0"
authors = ["thraa"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "shell", "sh", "bash", "windows"]
readme = "README.md"

[workspace.dependencies]
cash-awk = { version = "1.0.0", path = "crates/cash-awk" }
cash-bc = { version = "1.0.0", path = "crates/cash-bc" }
cash-builtins = { version = "1.0.0", path = "crates/cash-builtins" }
cash-core = { version = "1.0.0", path = "crates/cash-core" }
cash-coreutils-builtins = { version = "1.0.0", path = "crates/cash-coreutils-builtins" }
cash-interactive = { version = "1.0.0", path = "crates/cash-interactive" }
cash-parser = { version = "1.0.0", path = "crates/cash-parser" }
cash-sed = { version = "1.0.0", path = "crates/cash-sed" }
cash-shell = { version = "1.0.0", path = "crates/cash-shell" }
cash-test-harness = { version = "1.0.0", path = "crates/cash-test-harness" }
cash-win32 = { version = "1.0.0", path = "crates/cash-win32" }

# Lint configuration inherited from brush (MIT, (c) 2024 reuben olinsky). Kept as-is:
# it is strict, the absorbed code already satisfies it, and loosening it would let the
# absorbed crates rot.
[workspace.lints.rust]
warnings = { level = "deny" }
future_incompatible = { level = "deny" }
missing_docs = { level = "deny" }
nonstandard_style = { level = "deny" }
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_attributes = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unknown_lints = { level = "allow", priority = -100 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

expect_used = "deny"
format_push_string = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
todo = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

bool_to_int_with_if = "allow"
cognitive_complexity = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
if_same_then_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
# Interactive cash catches an unexpected panic at the command boundary and returns to
# the prompt. `abort` bypasses that recovery path and terminates the entire shell.
panic = "unwind"

[profile.bench]
inherits = "release"
strip = "debuginfo"

# Reedline 0.51.0 with the patches listed in vendor/reedline/CASH-PATCHES.md: a `bind -x`
# command's output was painted over by the next prompt (ROADMAP item 15); each keystroke
# redrew the whole prompt; each paste waited 100 ms before it was drawn.
#
# Crossterm 0.29.0 with the patch in vendor/crossterm/CASH-PATCHES.md: console input is
# read in batches rather than one record per round trip to the console host.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
reedline = { path = "vendor/reedline" }
