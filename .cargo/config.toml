# `cargo xtask ...` runs the workspace's own task runner (`xtask/`): `cargo xtask gen ...`,
# `cargo xtask check ...`, `cargo xtask ci quick`. CI runs the same commands
# (.github/workflows/ci.yml).
[alias]
xtask = "run --package xtask --quiet --"

# cash.exe carries the C runtime instead of needing `VCRUNTIME140.dll`, which a clean
# Windows lacks and only an admin can install as the Visual C++ Redistributable
# (ROADMAP item 18). The release workflow checks the import is gone.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# A cash built here is "portable" (neither Scoop's nor the installer's), so at its first
# interactive prompt it would offer to set up PATH, the Terminal profile and the tool
# links, and every pseudo-console test would wait on that question. Test binaries and
# `cargo run` get this in their environment, and the cash they start inherits it; the
# offer's own tests remove it again.
[env]
CASH_NO_OFFER = "1"
# A test that runs a shell in its own thread (`Shell::builder()`, then `complete` or
# `run_string`) gets the stack the shell's threads have (`SHELL_THREAD_STACK_SIZE`, 256 MiB,
# reserved, not committed), not libtest's 2 MiB: since the interpreter's futures nest in
# place (D86), a debug build's frames are large, and a completion script's few function
# calls overflowed it.
RUST_MIN_STACK = "268435456"
