# Weekly update proposals, one grouped pull request per ecosystem, so that a dependency
# with a fix does not wait for someone to notice it. CI runs the whole suite on each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # crossterm is cash's own (crates/cash-crossterm), kept at 0.29.0 for uu_more through
      # [patch.crates-io]; the uutils crates move together, on one uucore, with the
      # tools cash made its own (crates/cash-uutils).
      - dependency-name: crossterm
      - dependency-name: "uu_*"
      - dependency-name: uucore

  # The pinned commits in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The version rust-toolchain.toml names, which CI installs.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
