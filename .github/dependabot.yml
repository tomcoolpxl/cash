# Weekly update proposals, one grouped pull request per ecosystem, so that a dependency
# with a fix does not wait for someone to notice it. CI runs the whole suite on each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Patched copies in vendor/ ([patch.crates-io] in Cargo.toml): a new version needs
      # cash's patch carried over by hand (vendor/*/CASH-PATCHES.md), and the other uutils
      # crates move with the patched ones, on the same uucore.
      - dependency-name: crossterm
      - dependency-name: "uu_*"
      - dependency-name: uucore

  # The pinned commits in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The version rust-toolchain.toml names, which CI installs.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
