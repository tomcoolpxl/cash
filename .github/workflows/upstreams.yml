name: Upstreams

# Weekly, what no push would show: a RustSec advisory published since the last run against
# a crate in Cargo.lock, and the upstreams cash took in as crates of its own against what
# upstream has done since (`cargo xtask upstreams`, upstreams.toml). Anything that wants
# looking at goes into one issue labelled `upstreams`, opened or brought up to date.
on:
  schedule:
    - cron: '17 6 * * 1'
  # On demand: from the Actions tab, or `gh workflow run upstreams.yml`.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit, with the version it was in a comment;
# Dependabot proposes the updates (.github/dependabot.yml).
jobs:
  watch:
    name: Advisories and upstreams
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version rust-toolchain.toml names, with the components it lists.
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny

      - name: RustSec advisories
        id: advisories
        continue-on-error: true
        shell: pwsh
        run: |
          cargo deny --color never check advisories 2>&1 | Tee-Object -FilePath advisories.txt
          exit $LASTEXITCODE

      - name: Upstreams
        id: upstreams
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask upstreams --report upstreams.md

      - name: Open or update the issue
        if: steps.advisories.outcome == 'failure' || steps.upstreams.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/scripts/upstreams-issue.ps1
          -Advisories '${{ steps.advisories.outcome }}'
          -Upstreams '${{ steps.upstreams.outcome }}'
