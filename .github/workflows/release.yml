name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.8). Leave empty when the run is started from the tag itself.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release (a tag with a "-", such as v1.4.0-rc.1, always is)'
        type: boolean
        default: false

# Read-only, except for the one job that publishes the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

# Third-party actions are pinned to a commit, with the version it was in a comment;
# Dependabot proposes the updates (.github/dependabot.yml).
jobs:
  # ── Gate: run the full CI suite on the commit being released ──────────
  ci:
    name: CI Gate (Windows)
    runs-on: windows-latest
    steps:
      # The tag's commit, also when the run was started by hand from another branch.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest,cargo-deny

      # The same steps as ci.yml.
      - name: RustSec advisories
        run: cargo deny check advisories

      - name: Check and test
        run: cargo xtask ci full

      - name: Clippy, all features
        run: cargo xtask check lint --all-features

      - name: Report flaky tests
        if: always()
        shell: pwsh
        run: ./.github/scripts/report-flaky.ps1 -Results target/nextest/ci/test-results.xml

  # ── Build release binary and publish GitHub Release ───────────────────
  release:
    name: Build & Publish Release
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history and tags, for the release notes below.
          fetch-depth: 0
          persist-credentials: false

      # The tag reaches the script through the environment, never pasted into it, and
      # must look like a release tag before anything else uses it.
      - name: Determine release tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Not a release tag: '$tag'. Start the run from a tag, or name one."
            exit 1
          }
          $prerelease = if ($tag.Contains('-')) { 'true' } else { 'false' }
          Write-Host "Release tag: $tag (pre-release: $prerelease)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tagVersion = $env:TAG -replace '^v', ''
          # Strip any pre-release suffix for comparison (e.g. v0.8.0-rc.1 → 0.8.0)
          $tagBase = ($tagVersion -split '-')[0]
          if ($tagBase -ne $cargoVersion) {
            Write-Error "Tag version ($tagBase) does not match Cargo.toml version ($cargoVersion)"
            exit 1
          }
          Write-Host "✓ Tag $env:TAG matches Cargo.toml version $cargoVersion"

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      # No build cache here: what ships is built from the lock file alone.
      # `dist` is the fully optimized profile (fat LTO, one codegen unit); `release`
      # is the quicker one used for local installs. See Cargo.toml.
      - name: Build release binary
        run: cargo build --profile dist --bin cash --locked

      - name: Print version
        run: target\dist\cash.exe --version

      # cash.exe carries the C runtime (.cargo/config.toml): a clean Windows has no
      # VCRUNTIME140.dll, and only an admin can install one (ROADMAP item 18).
      - name: Check cash.exe needs no C runtime DLL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $dlls = & $dumpbin /nologo /dependents target\dist\cash.exe |
            Select-String -Pattern '^\s+\S+\.dll$' | ForEach-Object { $_.Line.Trim() }
          $dlls
          $crt = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
          if ($crt) {
            Write-Error "cash.exe needs the C runtime: $($crt -join ', ')"
            exit 1
          }

      - name: Install cargo-about
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about

      # The licences of the crates cash.exe is built from; a crate under a licence
      # .github/about/about.toml does not accept stops the release.
      - name: Write the third-party licences
        run: >-
          cargo about generate --locked --fail
          -c .github/about/about.toml -m crates/cash/Cargo.toml
          -o THIRD-PARTY-LICENSES.html .github/about/about.hbs

      - name: Package release assets
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $archiveName = "cash-$env:TAG-x86_64-pc-windows-msvc.zip"
          $distDir = "dist"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          Copy-Item target/dist/cash.exe $distDir/
          Copy-Item README.md $distDir/
          Copy-Item LICENSE $distDir/
          # The notices of code cash absorbed (NOTICE, licenses/) and of the crates it is
          # built from: MIT and Apache-2.0 ask for them with every copy.
          Copy-Item NOTICE $distDir/
          Copy-Item licenses $distDir/ -Recurse
          Copy-Item THIRD-PARTY-LICENSES.html $distDir/

          Compress-Archive -Path "$distDir/*" -DestinationPath $archiveName

          $hash = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveName" | Out-File -FilePath "$archiveName.sha256" -Encoding ascii

          Write-Host "Archive: $archiveName"
          Write-Host "SHA256:  $hash"

      # The per-user installer (packaging/inno/cash.iss): the same files, in Scoop's
      # layout under %LOCALAPPDATA%\Programs\cash, finished by `cash --install-finish`.
      # Inno Setup is preinstalled on the Windows runner; ISCC takes the version and the
      # dist folder as defines. Unsigned, so a browser download shows SmartScreen once.
      - name: Build the installer
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\dist" "/O$PWD" packaging\inno\cash.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "cash-$env:TAG-setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "no $setup was written"; exit 1 }
          $hash = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup" | Out-File -FilePath "$setup.sha256" -Encoding ascii
          Write-Host "Installer: $setup"
          Write-Host "SHA256:    $hash"

      # GitHub's generated notes list merged pull requests, and most work here is
      # committed straight to main, so they would be empty. Write the commit subjects
      # since the previous tag instead, grouped by Conventional Commits type; the
      # generated section (pull requests and the full-changelog link) is still appended
      # below them.
      - name: Write release notes
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        # Grouped by Conventional Commits type; see RELEASING.md, "Commit messages".
        run: ./.github/scripts/release-notes.ps1 -Tag $env:TAG -Out release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ inputs.prerelease || steps.tag.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            cash-*-x86_64-pc-windows-msvc.zip
            cash-*-x86_64-pc-windows-msvc.zip.sha256
            cash-*-setup.exe
            cash-*-setup.exe.sha256
