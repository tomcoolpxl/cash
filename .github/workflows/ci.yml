name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test & Lint (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The same command as a local run: format check, clippy, every test (each in a
      # process of its own, through nextest), then the doc tests.
      - name: Check and test
        run: cargo xtask ci full

      # Local builds use the default features only, so that one build serves check,
      # clippy and the tests; the other features are linted here.
      - name: Clippy, all features
        run: cargo xtask check lint --all-features
