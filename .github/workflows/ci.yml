name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test & Lint (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check Workspace
        run: cargo check --workspace --all-targets

      - name: Run Tests
        run: cargo test --workspace --no-fail-fast

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  bash-5-2-differential:
    name: Bash 5.2 differential (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Verify Bash oracle
        run: |
          bash --version | head -n 1
          [[ $BASH_VERSION == 5.2.* ]]

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build cash
        run: cargo build -p cash

      - name: Compare focused Bash 5.2 behavior
        run: bash tests/bash52-differential.sh bash target/debug/cash
