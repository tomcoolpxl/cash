name: CI

# Two lanes (.config/nextest.toml): the lints and every crate's own tests in one job, and
# the slow lane's tests (the ones that drive cash.exe, rars' and sed's ported suite) in
# four parts at once, each on a runner of its own.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # On demand: from the Actions tab, or `gh workflow run ci.yml`.
  workflow_dispatch:
  # Before a release: release.yml runs both lanes on the commit it releases.
  workflow_call:
    inputs:
      ref:
        description: 'The tag or commit to check; empty for the one the run started from'
        type: string
        required: false
        default: ''

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit, with the version it was in a comment;
# Dependabot proposes the updates (.github/dependabot.yml).
jobs:
  quick:
    name: Lint & quick tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The version rust-toolchain.toml names, with the components it lists.
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest,cargo-deny

      # A crate cash.exe is built from that RustSec lists, or that was yanked (deny.toml).
      - name: RustSec advisories
        run: cargo deny check advisories

      # The installer's script compiles, so a mistake in it shows on the push and not first
      # in a release: against placeholder files, where the release has the real ones.
      - name: Compile the installer script
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'inno-dist'
          New-Item -ItemType Directory -Force "$dist\licenses" | Out-Null
          foreach ($file in 'cash.exe', 'README.md', 'NOTICE', 'THIRD-PARTY-LICENSES.html', 'licenses\placeholder.txt') {
            Set-Content -Path "$dist\$file" -Value 'placeholder'
          }
          Copy-Item LICENSE "$dist\LICENSE"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc /Q "/DAppVersion=0.0.0" "/DSourceDir=$dist" "/O$env:RUNNER_TEMP" packaging\inno\cash.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The same command as a local run: format check, clippy, the documentation, the
      # quick lane's tests (each in a process of its own, through nextest) and the doc
      # tests.
      - name: Check and test
        run: cargo xtask ci quick

      # Local builds use the default features only, so that one build serves check,
      # clippy and the tests; the other features are linted here.
      - name: Clippy, all features
        run: cargo xtask check lint --all-features

      # nextest retries a failed test (.config/nextest.toml). One that passed on a retry
      # is listed in the run's summary and as a warning, rather than hidden by a green run.
      - name: Report flaky tests
        if: always()
        shell: pwsh
        run: ./.github/scripts/report-flaky.ps1 -Results target/nextest/default/test-results.xml

      # Nothing reads the documentation after the run, and the cache's cleanup took a
      # directory rustdoc made for a module for a build directory, and failed on it (ENOENT
      # annotations on every green run).
      - name: Leave the documentation out of the cache
        if: always()
        shell: pwsh
        run: if (Test-Path target/doc) { Remove-Item -Recurse -Force target/doc }

  slow:
    name: Slow tests ${{ matrix.part }}/4 (Windows)
    runs-on: windows-latest
    strategy:
      # Each part reports its own failures.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      # The four parts build the same tests, and share one cache, which the first saves.
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ matrix.part == 1 }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      # nextest's hash partition: each test always falls in the same part.
      - name: Slow lane's tests, part ${{ matrix.part }} of 4
        run: cargo xtask test slow --partition hash:${{ matrix.part }}/4

      - name: Report flaky tests
        if: always()
        shell: pwsh
        run: ./.github/scripts/report-flaky.ps1 -Results target/nextest/slow/test-results.xml
