# `cargo about generate` in release.yml: the licences of the crates cash.exe is built
# from, shipped in the release zip as THIRD-PARTY-LICENSES.html (ROADMAP item 18).
# A crate under a licence not listed here fails the release, to be looked at first.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
