[profile.default]
retries = 3
status-level = "slow"
slow-timeout = { period = "5s", terminate-after = 3, grace-period = "2s" }
fail-fast = false

[profile.default.junit]
path = "test-results.xml"

# nextest runs each test in a process of its own, so a lock inside a test process
# serializes nothing; these groups are how tests take turns.
[test-groups]
# Each links folder gives the test's cash.exe 126 more names, and NTFS allows a file
# 1023 (link_tools.rs).
link-tools = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(it) and test(/^link_tools::/)'
test-group = 'link-tools'

# Tests that are slow by nature, rather than stuck: each gets three periods.
# A whole screen-by-screen comparison with Git Bash on a ConPTY: 45 s on an idle machine.
# ConPTY paints on its own schedule and merges keys into late frames when the CPU is
# busy (pty_latency.rs), so it takes every test slot and runs alone.
[[profile.default.overrides]]
filter = 'binary(pty-oracle)'
slow-timeout = { period = "60s", terminate-after = 3 }
threads-required = "num-test-threads"

# Starts a background job, sends Ctrl-C a second later and looks a second after that:
# it passed 10 runs in 10 alone, and failed about one full run in three with every core
# busy. So it runs alone.
[[profile.default.overrides]]
filter = 'binary(it) and test(=job_groups::at_the_prompt_a_background_job_survives_ctrl_c)'
threads-required = "num-test-threads"

# Spins two threads per processor for a tenth of a second, to make a processor queue it
# can count. It runs alone, rather than take every core from the timing-bound tests that
# would otherwise run beside it.
[[profile.default.overrides]]
filter = 'package(cash-win32) and test(=sysinfo::tests::more_busy_threads_than_processors_make_a_queue)'
threads-required = "num-test-threads"

# Each starts PowerShell once or twice, and each compiles a C# helper: 2 to 5 s on an idle
# machine.
[[profile.default.overrides]]
filter = 'binary(conpty-interactive-tests) and test(/^conpty_a_program_that_/)'
slow-timeout = { period = "20s", terminate-after = 3 }

# Each watches `ping.exe` reply once a second, stopped and running: 3 to 10 s idle.
[[profile.default.overrides]]
filter = 'binary(conpty-interactive-tests) and test(/^conpty_(ctrl_z|kill_stop|keys_typed_before_ctrl_z)/)'
slow-timeout = { period = "20s", terminate-after = 3 }

# Each runs a real docker, kubectl, gh or rustup, and then cash completes a word with it:
# under a second when the tool is warm. On a fresh GitHub runner, the first launch of
# each Go tool took 10 to 37 s, and nextest's retry then passed in under a second. The
# test gives the tool up to a minute of its own, outside cash, and skips it if that runs
# out (TOOL_DEADLINE in completion_scripts.rs); the last period is cash's. The output
# says how long each part took, and why a test skipped.
[[profile.default.overrides]]
filter = 'binary(it) and test(/^completion_scripts::((docker|kubectl|gh)_completion_works|a_clap_generated_script_works_too)$/)'
slow-timeout = { period = "30s", terminate-after = 3 }
success-output = "final"

# `fuser` on a system DLL gets no answer from the Restart Manager, so cash reads the module
# list of every process and resolves each module's path, 15,000 of them on a desktop:
# 2.5 to 6.5 s alone, 5 to 8 s in a full run, and 42 s in a full run beside another
# worktree's build. A unit test that made the same walk timed out at 15 s; this is the one
# test that still makes it.
[[profile.default.overrides]]
filter = 'binary(it) and test(=fuser_lsof::fuser_marks_an_executable_and_a_loaded_module)'
slow-timeout = { period = "30s", terminate-after = 3 }

# math.sed computing pi: 9 s with every core busy.
[[profile.default.overrides]]
filter = 'package(cash-sed) and test(=test_sed::pi)'
slow-timeout = { period = "15s", terminate-after = 3 }
