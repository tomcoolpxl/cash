[profile.default]
retries = 3
status-level = "slow"
slow-timeout = { period = "5s", terminate-after = 3, grace-period = "2s" }
fail-fast = false

[profile.default.junit]
path = "test-results.xml"

# CI's profile (NEXTEST_PROFILE=ci in the workflows): the default profile's retries,
# groups and timeouts, which it inherits, with its results in target/nextest/ci, where
# .github/scripts/report-flaky.ps1 lists the tests that passed only on a retry.
[profile.ci]

[profile.ci.junit]
path = "test-results.xml"

# nextest runs each test in a process of its own, so a lock inside a test process
# serializes nothing; these groups are how tests take turns.
[test-groups]
# Each links folder gives the test's cash.exe 126 more names, and NTFS allows a file
# 1023 (link_tools.rs).
link-tools = { max-threads = 1 }
# Each runs a cash on a pseudo console of its own and types at it. A console host paints
# on its own schedule, and late when every core is busy: with a dozen consoles at once,
# `conpty_ctrl_z_…` and `conpty_interactive_variables_and_arithmetic` each failed a full
# run on 2026-09-30 and passed alone. So no more than four run at the same time.
conpty = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(it) and test(/^link_tools::/)'
test-group = 'link-tools'

[[profile.default.overrides]]
filter = 'binary(conpty-interactive-tests) or (binary(it) and test(/^(read_console|ctrl_c)::/))'
test-group = 'conpty'

# Tests that are slow by nature, rather than stuck: each gets three periods.
# A whole screen-by-screen comparison with Git Bash on a ConPTY: 45 s on an idle machine.
# ConPTY paints on its own schedule and merges keys into late frames when the CPU is
# busy (pty_latency.rs), so it takes every test slot and runs alone.
[[profile.default.overrides]]
filter = 'binary(pty-oracle)'
slow-timeout = { period = "60s", terminate-after = 3 }
threads-required = "num-test-threads"

# Starts a background job, sends Ctrl-C a second later and looks a second after that:
# it passed 10 runs in 10 alone, and failed about one full run in three with every core
# busy. So it runs alone.
[[profile.default.overrides]]
filter = 'binary(it) and test(=job_groups::at_the_prompt_a_background_job_survives_ctrl_c)'
threads-required = "num-test-threads"

# Spins two threads per processor for a tenth of a second, to make a processor queue it
# can count. It runs alone, rather than take every core from the timing-bound tests that
# would otherwise run beside it.
[[profile.default.overrides]]
filter = 'package(cash-win32) and test(=sysinfo::tests::more_busy_threads_than_processors_make_a_queue)'
threads-required = "num-test-threads"

# Each starts PowerShell once or twice, and each compiles a C# helper: 2 to 5 s on an idle
# machine.
[[profile.default.overrides]]
filter = 'binary(conpty-interactive-tests) and test(/^conpty_a_program_that_/)'
slow-timeout = { period = "20s", terminate-after = 3 }

# Each watches `ping.exe` reply once a second, stopped and running: 3 to 10 s idle.
[[profile.default.overrides]]
filter = 'binary(conpty-interactive-tests) and test(/^conpty_(ctrl_z|kill_stop|keys_typed_before_ctrl_z)/)'
slow-timeout = { period = "20s", terminate-after = 3 }

# Each runs a real docker, kubectl, gh or rustup, and then cash completes a word with it:
# under a second when the tool is warm. On a fresh GitHub runner, the first launch of
# each Go tool took 10 to 37 s, and nextest's retry then passed in under a second. The
# test gives the tool up to a minute of its own, outside cash, and skips it if that runs
# out (TOOL_DEADLINE in completion_scripts.rs); the last period is cash's. The output
# says how long each part took, and why a test skipped.
[[profile.default.overrides]]
filter = 'binary(it) and test(/^completion_scripts::((docker|kubectl|gh)_completion_works|a_clap_generated_script_works_too)$/)'
slow-timeout = { period = "30s", terminate-after = 3 }
success-output = "final"

# `fuser` on a system DLL gets no answer from the Restart Manager, so cash reads the module
# list of every process, 12,500 modules on a desktop. Until 2026-10-02 it resolved each
# module's path and asked for each one by itself: 2.5 to 6.5 s alone and 42 s beside
# another build. It reads a list in one snapshot now and resolves only the modules of the
# file's name, 0.4 s alone in a debug build; the timeout stays, as this is still the one
# test that makes the walk.
[[profile.default.overrides]]
filter = 'binary(it) and test(=fuser_lsof::fuser_marks_an_executable_and_a_loaded_module)'
slow-timeout = { period = "30s", terminate-after = 3 }

# Every `tests/corpus` case, eight at a time (WORKERS in corpus_goldens.rs), so it takes
# eight slots and three periods of its own.
[[profile.default.overrides]]
filter = 'binary(it) and test(=corpus_goldens::every_corpus_case_gives_the_oracles_output)'
threads-required = 8
slow-timeout = { period = "30s", terminate-after = 3 }

# Makes about forty git repositories (15 s idle) and runs 115 prompt cases in them, eight
# at a time (25 s idle; tests/git-prompt-differential.sh).
[[profile.default.overrides]]
filter = 'binary(it) and test(=git_prompt_goldens::git_prompt_scripts_give_git_bashs_frozen_output)'
threads-required = 8
slow-timeout = { period = "60s", terminate-after = 3 }

# Tests that skip where an optional thing is missing: a tool cash does not need
# (starship), a second drive, a desktop that can show a window, a network on which an
# address does not answer. Each says "skipped: why" on standard error, and this prints it
# at the end of the run, so a skip is seen rather than counted as a pass (BIN-20). What
# cash does need, Git for Windows (spec D35) and Windows' own programs, fails a test
# instead. completion_scripts' tool tests do the same, above.
[[profile.default.overrides]]
filter = 'binary(it) and test(/^(acceptance::starship_initialises_and_renders_a_prompt|ping::an_interrupt_prints_the_statistics|link_tools::a_folder_on_another_drive_is_an_error|kill_term::a_program_(with_a_window_is_asked_to_close|that_will_not_close_is_terminated_after_the_grace_period)|ping::an_unanswered_ping_reports_total_loss)$/)'
success-output = "final"

# math.sed computing pi: 9 s with every core busy.
[[profile.default.overrides]]
filter = 'package(cash-sed) and test(=test_sed::pi)'
slow-timeout = { period = "15s", terminate-after = 3 }
