# winget installer manifest for cash: the per-user Inno Setup installer from the releases
# page (packaging/inno/cash.iss). Replace VERSION and SHA256 (from the setup's .sha256
# asset). The installer type cannot change once published.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
PackageIdentifier: tomcoolpxl.cash
PackageVersion: VERSION
InstallerType: inno
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
  SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART
  Custom: /TASKS=links
UpgradeBehavior: install
# Inno's uninstall key for AppId {B7E3A0C4-5D2F-4F4B-9E8A-7C1D2B3E4F50}.
ProductCode: '{B7E3A0C4-5D2F-4F4B-9E8A-7C1D2B3E4F50}_is1'
Commands:
- cash
FileExtensions:
- sh
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/tomcoolpxl/cash/releases/download/vVERSION/cash-vVERSION-setup.exe
  InstallerSha256: SHA256
ManifestType: installer
ManifestVersion: 1.9.0
